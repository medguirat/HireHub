# The app (single-page: unknown paths get index.html) and, on the same origin, the API and the
# public images, forwarded to the backend on the internal network.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # CVs up to 10 MB (the backend's own limit is checked first and answers with a clear message).
    client_max_body_size 12m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        # The client's real address, for the backend's rate limits (forward-headers-strategy=native).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # One id per request, in nginx's and the backend's logs and in error answers.
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
    }

    # Built files have a content hash in their name: cache them for a year.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}

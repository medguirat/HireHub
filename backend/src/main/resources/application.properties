spring.application.name=hirehub-backend

spring.datasource.url=jdbc:mysql://localhost:3306/hirehub_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=marwa1405

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081

# Uploaded files (CVs, cover letters, logos, avatars). Keep request size a
# couple MB above the file limit so multipart boundary overhead never trips
# the request-size check before our own file-size check does.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
# When an upload is rejected, Tomcat only drains this much of the unread body
# before aborting the connection. With the 2MB default, a browser uploading a
# slightly-too-big CV got a connection error instead of the 413 message.
server.tomcat.max-swallow-size=20MB

# Python ai-service (CV text extraction + matching)
ai-service.base-url=${AI_SERVICE_URL:http://localhost:8000}
ai-service.read-timeout-seconds=30
ai-service.health-check.interval-ms=15000
# Candidates' matching CVs: private, never served from /uploads
app.cv-storage-dir=${CV_STORAGE_DIR:cv-store}

# Configuration de messagerie (SMTP)
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.application.name=hirehub-backend

# Secrets and local settings come from environment variables or the repository's root .env
# file (see .env.example). The backend runs from backend/, so the file is one level up.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hirehub_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Signing key for login tokens: required, base64, at least 256 bits (checked at startup).
jwt.secret=${JWT_SECRET:}
# The browser session: the login token in an HttpOnly, SameSite=Strict cookie (SessionCookie), valid
# as long as the token (1 hour). Secure (HTTPS only) in production.
jwt.expiration-ms=3600000
app.session.cookie-secure=${SESSION_COOKIE_SECURE:false}

# Profiles: "dev" when none is chosen (npm run dev, an IDE), "prod" in Docker (SPRING_PROFILES_ACTIVE),
# "test" in the backend tests. Their own settings are in application-<profile>.properties.
spring.profiles.default=dev

# The schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks that the
# entities match it and never changes it. A database created before Flyway (by Hibernate) is marked
# as version 1 on first start, then brought up to date by the later migrations.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Schema created by Hibernate before Flyway

server.port=8081

# Uploaded files (CVs, cover letters, logos, avatars). Keep request size a
# couple MB above the file limit so multipart boundary overhead never trips
# the request-size check before our own file-size check does.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
# When an upload is rejected, Tomcat only drains this much of the unread body
# before aborting the connection. With the 2MB default, a browser uploading a
# slightly-too-big CV got a connection error instead of the 413 message.
server.tomcat.max-swallow-size=20MB

# Python ai-service (CV text extraction + matching)
ai-service.base-url=${AI_SERVICE_URL:http://localhost:8000}
# Shared with the ai-service, which answers nobody else (required, at least 32 characters).
ai-service.api-key=${AI_SERVICE_KEY:}
ai-service.read-timeout-seconds=30
ai-service.health-check.interval-ms=15000
# Candidates' matching CVs: private, never served from /uploads
app.cv-storage-dir=${CV_STORAGE_DIR:cv-store}

# Email. MAIL_MODE=mailpit (default): Mailpit, the local test inbox that `npm run dev` starts
# (web UI: http://localhost:8025); nothing leaves the machine. MAIL_MODE=smtp: a real mail server
# from SMTP_* (e.g. Gmail with an app password, see the README). Checked at startup (MailConfig).
app.mail.mode=${MAIL_MODE:mailpit}
app.mail.mailpit.host=${MAILPIT_HOST:localhost}
app.mail.mailpit.port=${MAILPIT_SMTP_PORT:1025}
app.mail.smtp.host=${SMTP_HOST:}
app.mail.smtp.port=${SMTP_PORT:587}
app.mail.smtp.username=${SMTP_USERNAME:}
app.mail.smtp.password=${SMTP_PASSWORD:}
# Sender shown to recipients. Empty: "HireHub <SMTP_USERNAME>" in smtp mode (what Gmail requires).
app.mail.from=${MAIL_FROM:}

# Rate limits. "Forgot password": requests per IP address per 15 minutes (over it: 429), and per
# email per hour (over it: same answer, no email sent).
app.rate-limit.password-reset.per-ip=${RATE_LIMIT_PASSWORD_RESET_PER_IP:10}
app.rate-limit.password-reset.per-email=${RATE_LIMIT_PASSWORD_RESET_PER_EMAIL:5}
# Login: attempts per IP address per 5 minutes (over it: 429), and failed attempts per email per
# 15 minutes (over it: 429 for that email until it refills; a successful login resets it).
app.rate-limit.login.per-ip=${RATE_LIMIT_LOGIN_PER_IP:30}
app.rate-limit.login.failures-per-email=${RATE_LIMIT_LOGIN_FAILURES_PER_EMAIL:5}

# Links in emails point to the frontend.
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
# "Forgot password" links expire after this many minutes (single use).
app.password-reset.validity-minutes=45

# Logs: every line of a request carries its id (RequestIdFilter, also the errors' correlationId).
# The prod profile writes JSON lines (ECS) instead, for a log collector.
logging.pattern.correlation=[%X{requestId:-}] 

# Actuator. /actuator/health (with liveness and readiness groups, used by Docker) and /actuator/info
# are public; /actuator/metrics only from this machine or a private network (SecurityConfig).
# Readiness = the database; the ai-service shows in /actuator/health but never makes the app "not
# ready" (only CV matching depends on it), and neither does the mail server.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-components=always
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
management.health.mail.enabled=false
management.info.java.enabled=true

# API documentation: /v3/api-docs (OpenAPI 3) and /swagger-ui.html. Off by default in prod.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.paths-to-match=/api/**
# Swagger UI sends the XSRF-TOKEN cookie's value back, for calls made with the session cookie.
springdoc.swagger-ui.csrf.enabled=true

# Production (Docker sets SPRING_PROFILES_ACTIVE=prod): no SQL in the logs, no error details in
# answers (the unified API errors already carry a correlation id for the logs).
spring.jpa.show-sql=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

# One JSON object per log line (Elastic Common Schema), with the request id from the MDC.
logging.structured.format.console=ecs
logging.structured.ecs.service.name=hirehub-backend

springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}

# The session cookie only travels over HTTPS (browsers accept it on http://localhost too).
app.session.cookie-secure=${SESSION_COOKIE_SECURE:true}

# Behind nginx (Docker): the client's real address and scheme come from X-Forwarded-For /
# X-Forwarded-Proto, trusted only from private network addresses (Tomcat's RemoteIpValve), so
# the rate limits count real clients, not the proxy.
server.forward-headers-strategy=native

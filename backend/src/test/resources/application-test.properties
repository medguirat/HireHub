# Integration tests (@ActiveProfiles("test")) run against their own database so
# they never see, depend on, or modify the development data in hirehub_db.
# Username/password come from the main application.properties (DB_USERNAME / DB_PASSWORD in .env).
spring.datasource.url=jdbc:mysql://localhost:3306/hirehub_test?createDatabaseIfNotExist=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Tests never talk to a real ai-service: it's mocked where needed.
ai-service.health-check.enabled=false
app.cv-storage-dir=target/test-cv-store
app.public-upload-dir=target/test-uploads

# Test-only signing key (tests never use the real JWT_SECRET from .env). Not a secret: it
# signs tokens for the throwaway hirehub_test database only.

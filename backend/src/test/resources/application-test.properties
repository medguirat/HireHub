# Integration tests (@ActiveProfiles("test")) run against their own database so
# they never see, depend on, or modify the development data in hirehub_db.
# Username/password come from the main application.properties (DB_USERNAME / DB_PASSWORD in .env).
spring.datasource.url=jdbc:mysql://localhost:3306/hirehub_test?createDatabaseIfNotExist=true
# The schema comes from the Flyway migrations, as in production, and starts empty for each test
# context (TestDatabaseConfig cleans, then migrates). Hibernate checks the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.clean-disabled=false

# Tests never talk to a real ai-service: it's mocked where needed. Test-only key.
ai-service.api-key=test-internal-key-0123456789abcdef
ai-service.health-check.enabled=false
app.cv-storage-dir=target/test-cv-store
app.public-upload-dir=target/test-uploads

# Test-only signing key (tests never use the real JWT_SECRET from .env). Not a secret: it
# signs tokens for the throwaway hirehub_test database only.
jwt.secret=NKJDMDxOZxyhUqfSgay1eqwX5UIck2daP6IST/nYz4F55zzhX7hawqWey1VwVG0E

# Emails go to a mocked or local sender in tests, never to a real server.
app.mail.mode=mailpit
# The suite sends many requests from 127.0.0.1 and for the same emails; RateLimitIT tests the limits.
app.rate-limit.password-reset.per-ip=10000
app.rate-limit.password-reset.per-email=10000
app.rate-limit.login.per-ip=10000
app.rate-limit.login.failures-per-email=10000
